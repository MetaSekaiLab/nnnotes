name: CI

on:
  push:
    branches: [main]
  pull_request:
  # the Deck model workflow dispatches CI on the pull request it opens
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install (builds the extension module nnnotes._deck)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Lint
        run: python -m pyflakes src tests
      - name: Command line
        run: python -m nnnotes --help
      - name: Test
        run: python -m pytest

  goldens:
    # The golden records of the stages (tests/golden/*.json) were made with these library versions; with the same
    # versions installed an output change without a stage or converter version bump fails instead of being skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/goldens-constraints.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c .github/goldens-constraints.txt -e ".[test]"
      - name: Golden records
        env:
          GOLDENS_STRICT: "1"
        run: python -m pytest tests/test_goldens.py tests/test_objexport.py

  rust:
    # the extension module's own code (rust/); ournotes-deck is tested in its repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format and lints
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

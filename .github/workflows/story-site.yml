name: Story site

# Adds the stories that the published story sites do not have yet to them, one site per game region (hk-tw-mo at the
# bucket root, jp under jp/). A site (stories.json, stories/, models/, assets/, story/: the layout `nnnotes web`
# writes) lives in an S3 bucket; a region's run (story-site-region.yml) fetches its manifests (not its assets), builds
# the missing stories with `nnnotes web --story` on top of them, and uploads what the build added or changed: new
# assets first, then the story and model manifests, the indexes last. Nothing is deleted from the bucket.
#
# Triggers: moenotes-masterdata-sync sends repository_dispatch `masterdata-updated` (client_payload.regions) when a
# region starts serving a new master snapshot: those regions build; a daily schedule catches a missed dispatch (every
# region); workflow_dispatch builds one region or all, given stories (with `force`: again) or does a dry run.
# The regions: repository variable STORY_REGIONS (default "hk-tw-mo jp"). docs: .github/STORY_SITE.md

on:
  repository_dispatch:
    types: [masterdata-updated]
  workflow_dispatch:
    inputs:
      region:
        description: "the region to build (all: every region of STORY_REGIONS)"
        type: choice
        options: [all, hk-tw-mo, jp]
        default: all
      stories:
        description: "MasterAdv ids to build, separated by spaces or commas (empty: every story the site lacks)"
        required: false
        default: ""
      force:
        description: "rebuild the given stories (and their Live2D models) even though their manifests exist"
        type: boolean
        default: false
      dry_run:
        description: "build, but upload nothing"
        type: boolean
        default: false
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  regions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      regions: ${{ steps.regions.outputs.regions }}
      count: ${{ steps.regions.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: Regions to build
        id: regions
        env:
          STORY_REGIONS: ${{ vars.STORY_REGIONS || 'hk-tw-mo jp' }}
          REQUESTED_REGION: ${{ github.event.inputs.region }}
        run: python3 .github/scripts/story_site.py regions

  site:
    needs: regions
    if: needs.regions.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.regions) }}
    # One run per region at a time: every run rewrites its site's indexes from the manifests it fetched.
    concurrency:
      group: story-site-${{ matrix.region }}
      cancel-in-progress: false
    uses: ./.github/workflows/story-site-region.yml
    with:
      region: ${{ matrix.region }}
      stories: ${{ github.event.inputs.stories || '' }}
      force: ${{ github.event.inputs.force == 'true' }}
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    secrets: inherit

site_name: nnnotes
site_description: Offline data toolkit for BanG Dream! Our Notes game files
site_url: https://metasekailab.github.io/nnnotes/
repo_url: https://github.com/MetaSekaiLab/nnnotes
repo_name: MetaSekaiLab/nnnotes
edit_uri: edit/main/docs/
copyright: MIT License

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Home: index.md
  - Tutorial:
      - Quick start: quickstart.md
  - How-to guides:
      - Configure nnnotes: configuration.md
      - Export stories and lives: export.md
      - Build an ournotes-player site: site.md
      - Export every asset: assets.md
      - Japanese release: jp.md
      - Music data: music-data.md
  - Reference:
      - Commands: cli.md
      - Command outputs: commands.md
      - JSON schemas: schemas.md
      - Python API: api.md
      - Contracts: contracts.md
      - Stages: stages.md
      - Products: products.md
      - Views: views.md
      - Replay data: replay.md
      - UI library: ui.md
  - Explanation:
      - Architecture: architecture.md
      - Determinism: determinism.md
      - Validation: validation.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: null
            filters: public
            heading_level: 3
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_root_full_path: true
            show_source: false
            show_signature_annotations: true
            show_symbol_type_heading: true

validation:
  links:
    anchors: warn

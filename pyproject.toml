[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "nnnotes"
description = "Offline data toolkit for BanG Dream! Our Notes game files: catalogs, bundles, master data, stories, Live2D, audio and live charts"
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MetaMiku" }, { name = "emptysekai" }]
dependencies = [
    "UnityPy>=1.25",
    "numpy>=2.0",
    "Pillow>=10.0",
    "pycryptodome>=3.20",
    "grpcio>=1.49.1",
    "brotli>=1.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8", "pyflakes>=3.2", "jsonschema>=4.18"]
fonts = ["fonttools>=4.50", "freetype-py>=2.5", "scipy>=1.13"]

[project.scripts]
nnnotes = "nnnotes.cli:main"

[project.urls]
Homepage = "https://github.com/MetaSekaiLab/nnnotes"
Source = "https://github.com/MetaSekaiLab/nnnotes"
Issues = "https://github.com/MetaSekaiLab/nnnotes/issues"

[tool.maturin]
# the pure Python package src/nnnotes with the extension module nnnotes._deck (rust/: ournotes-sim of ournotes-deck,
# pinned by commit); the version is rust/Cargo.toml's, kept equal to nnnotes.__version__ (tests/test_musicdata.py)
python-source = "src"
module-name = "nnnotes._deck"
manifest-path = "rust/Cargo.toml"
profile = "release"
locked = true
include = [{ path = "CHANGELOG.md", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nnnotes"
description = "Offline data toolkit for BanG Dream! Our Notes game files: catalogs, bundles, master data, stories, Live2D, audio and live charts"
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MetaMiku" }, { name = "emptysekai" }]
dependencies = [
    "UnityPy>=1.25",
    "numpy>=2.0",
    "Pillow>=10.0",
    "pycryptodome>=3.20",
    "grpcio>=1.49.1",
    "brotli>=1.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8", "pyflakes>=3.2", "jsonschema>=4.18"]
fonts = ["fonttools>=4.50", "freetype-py>=2.5", "scipy>=1.13"]
# the deck model of music-data: one nnnotes version carries one ournotes-deck release (.github/workflows/deck.yml moves
# the pin when ournotes-deck publishes a newer one)
deck = ["ournotes-sim==0.0.11"]

[project.scripts]
nnnotes = "nnnotes.cli:main"

[project.urls]
Homepage = "https://github.com/MetaSekaiLab/nnnotes"
Source = "https://github.com/MetaSekaiLab/nnnotes"
Issues = "https://github.com/MetaSekaiLab/nnnotes/issues"

[tool.hatch.version]
path = "src/nnnotes/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nnnotes"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/CHANGELOG.md", "/README.md", "/README.en.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

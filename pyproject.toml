[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nnnotes"
description = "Offline data toolkit for BanG Dream! Our Notes game files: catalogs, bundles, master data, stories, Live2D, audio and live charts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MetaMiku" }, { name = "emptysekai" }]
dependencies = [
    "UnityPy>=1.25",
    "numpy>=2.0",
    "Pillow>=10.0",
    "pycryptodome>=3.20",
    "grpcio>=1.49.1",
    "brotli>=1.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.15", "jsonschema>=4.18", "import-linter>=2.1", "pyright>=1.1.414"]
fonts = ["fonttools>=4.50", "freetype-py>=2.5", "scipy>=1.13"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.29"]
# a depot remote in S3-compatible object storage ([depot] remote = "s3://...")
remote = ["boto3>=1.35"]
# the deck model of music-data: one nnnotes version carries one ournotes-deck release (.github/workflows/deck.yml moves
# the pin when ournotes-deck publishes a newer one)
deck = ["ournotes-sim==0.0.9"]

[project.scripts]
nnnotes = "nnnotes.cli:main"

[project.urls]
Homepage = "https://github.com/MetaSekaiLab/nnnotes"
Documentation = "https://metasekailab.github.io/nnnotes/"
Source = "https://github.com/MetaSekaiLab/nnnotes"
Issues = "https://github.com/MetaSekaiLab/nnnotes/issues"

[tool.hatch.version]
path = "src/nnnotes/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nnnotes"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/CHANGELOG.md", "/CONTRIBUTING.md", "/README.md", "/README.zh-CN.md", "/mkdocs.yml", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
# B023: the closures defined in loops are called within the iteration that defines them; B905: zip pairs columns whose
# lengths are checked where they are read
ignore = ["B023", "B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["nnnotes.content.liveoptions.LiveOptions"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
# the configuration and source layers, and the schemas, are checked in strict mode
strict = ["src/nnnotes/core", "src/nnnotes/source", "src/nnnotes/schemas"]

[tool.importlinter]
root_package = "nnnotes"

[[tool.importlinter.contracts]]
name = "Layers: each subpackage imports only the layers below it"
type = "layers"
layers = [
    "cli",
    "site | musicdata",
    "pipeline",
    "content",
    "unity",
    "formats",
    "source",
    "core",
]
containers = ["nnnotes"]
